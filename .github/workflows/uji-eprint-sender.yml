# Uji printer virtual E-Print Sender di Windows sungguhan: pasang printer, cetak satu dokumen,
# lalu pastikan eprint-sender menangkap PDF-nya dan mengunggah ke server tiruan.
#
# Kode sumber diambil dari repo privat SIDIGIT-23/eprint-sender memakai secret SIDIGIT_TOKEN
# (token perlu akses eprint-sender, Contents: Read-only). Tidak menerbitkan rilis apa pun.
#
# Jalankan:  gh workflow run uji-eprint-sender.yml -R sidigit-build/bangun [-f ref=main]
name: Uji E-Print Sender

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Cabang/tag di eprint-sender"
        required: false
        default: main

permissions: { contents: read }

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { repository: SIDIGIT-23/eprint-sender, ref: "${{ inputs.ref }}", token: "${{ secrets.SIDIGIT_TOKEN }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Pasang printer virtual
        shell: powershell
        run: |
          Set-Service -Name Spooler -StartupType Manual
          Start-Service -Name Spooler
          Get-Service Spooler | Format-List Name, Status
          .\scripts\pasang-printer.ps1
          Get-Printer | Format-Table Name, DriverName, PortName -AutoSize

      - name: Cetak dan kirim
        shell: powershell
        run: |
          $spool = Join-Path $env:ProgramData "EPrintSender\spool"
          $out = Join-Path $env:RUNNER_TEMP "uji"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $mock = Start-Process python -ArgumentList "tools\mock_unggah.py", "--port", "8770", "--token", "uji", "--simpan", "$out\unggahan" `
            -RedirectStandardOutput "$out\mock.log" -RedirectStandardError "$out\mock.err" -PassThru -NoNewWindow
          $sender = Start-Process "target\release\eprint-sender.exe" -ArgumentList "--server", "http://127.0.0.1:8770", "--token", "uji", "--tanpa-tanya", "--sekali" `
            -RedirectStandardOutput "$out\sender.log" -RedirectStandardError "$out\sender.err" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2

          "Uji cetak E-Print Sender`r`nBaris kedua`r`n$(Get-Date -Format o)" | Out-Printer -Name "E-Print SMPN 23"
          Write-Host "Dokumen dikirim ke printer virtual."

          $selesai = $sender.WaitForExit(90000)
          if (-not $selesai) { Write-Host "Sender belum selesai setelah 90 detik."; $sender.Kill() }
          Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue

          Write-Host "== antrean spooler"; Get-PrintJob -PrinterName "E-Print SMPN 23" | Format-Table Id, DocumentName, JobStatus -AutoSize
          Write-Host "== isi folder spool"; Get-ChildItem -Recurse $spool | Format-Table FullName, Length -AutoSize
          Write-Host "== log sender"; Get-Content "$out\sender.log", "$out\sender.err" -ErrorAction SilentlyContinue
          Write-Host "== log server tiruan"; Get-Content "$out\mock.log", "$out\mock.err" -ErrorAction SilentlyContinue

          $pdf = Join-Path $out "unggahan\job-1.pdf"
          if (-not (Test-Path $pdf)) { throw "GAGAL: server tiruan tidak menerima PDF." }
          $awal = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($pdf), 0, 5)
          if ($awal -ne "%PDF-") { throw "GAGAL: berkas yang diterima bukan PDF (awal: $awal)." }
          Write-Host "LULUS: PDF $((Get-Item $pdf).Length) byte diterima server tiruan."

      - name: Copot printer virtual
        shell: powershell
        run: |
          .\scripts\copot-printer.ps1 -HapusFolder
          if (Get-Printer -Name "E-Print SMPN 23" -ErrorAction SilentlyContinue) { throw "Printer masih terpasang setelah dicopot." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-uji-windows
          path: ${{ runner.temp }}/uji
          if-no-files-found: ignore
